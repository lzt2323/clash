name: Rust checks and packages

on:
  push:
    paths: ['rust/**', 'install.sh', 'LICENSE', '.github/workflows/rust.yml']
  pull_request:
    paths: ['rust/**', 'install.sh', 'LICENSE', '.github/workflows/rust.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools python3
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
          rustup default 1.99.0
          rustup target add '${{ matrix.target }}'
      - name: Check source and unit contracts
        run: |
          bash -n ../install.sh
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build static manager
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --locked --release --target '${{ matrix.target }}'
      - name: Verify real core, distribution and terminal interaction
        env:
          CLASH_RUST_BINARY: ${{ github.workspace }}/rust/target/${{ matrix.target }}/release/clash
        run: |
          mkdir -p /tmp/clash-rust-core
          "$CLASH_RUST_BINARY" --root /tmp/clash-rust-core install
          MIHOMO_BINARY=/tmp/clash-rust-core/bin/mihomo python3 -B tests/integration.py
          python3 -B tests/pty_test.py
      - name: Package manager without Python or Mihomo
        run: python3 package.py --binary 'target/${{ matrix.target }}/release/clash' --target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: clash-linux-rust-${{ matrix.target }}
          path: rust/dist/*
