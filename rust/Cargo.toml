[package]
name = "clash-linux"
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Standalone terminal manager for Mihomo"

[[bin]]
name = "clash"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
libc = "0.2"
signal-hook = "0.3"
ureq = { version = "2.12", features = ["json"] }
url = "2"
unicode-width = "0.2"
regex = "1"
flate2 = "1"
tar = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
